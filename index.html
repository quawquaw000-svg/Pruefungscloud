<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Schulprüfungs-Cloud zum sicheren Teilen alter Prüfungen">
  <title>Prüfungscloud</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/upload.css">
  <link rel="stylesheet" href="./css/cloud.css">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-nav="cloud" aria-label="Zur Prüfungscloud">
        <span class="brand-mark" aria-hidden="true">PC</span>
        <span>Prüfungscloud</span>
      </a>

      <nav class="main-nav" aria-label="Hauptbereich">
        <button class="segmented-switch" type="button" data-nav="upload" aria-label="Prüfung hochladen">
          <span>Prüfung hochladen</span>
        </button>
        <button class="segmented-switch active" type="button" data-nav="cloud" aria-label="Prüfungs-Cloud">
          <span>Prüfungs-Cloud</span>
        </button>
      </nav>

      <div class="header-actions">
        <button class="icon-button" id="theme-toggle" type="button" title="Darstellung wechseln" aria-label="Dunkles Design einschalten">
          <span id="theme-icon" aria-hidden="true">☾</span>
        </button>
        <button class="header-button" type="button" data-nav="favorites">Favoriten <span id="favorite-count" class="count-badge">0</span></button>
        <button class="header-button admin-nav" id="admin-nav" type="button" data-nav="admin" hidden>Admin</button>
      </div>
    </header>

    <main id="main-content">
      <section id="cloud-view" class="view active" aria-labelledby="cloud-title">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Gemeinsam lernen</p>
            <h1 id="cloud-title">Prüfungs-Cloud</h1>
          </div>
        </div>
        <div class="search-row">
          <label class="search-field" for="free-search">
            <span aria-hidden="true">⌕</span>
            <input id="free-search" type="search" placeholder="Prüfung, Thema, Lehrer oder Fach suchen">
          </label>
        </div>
        <div class="filter-panel" id="filter-panel">
          <label>Fach
            <select id="filter-subject"><option value="">Alle Fächer</option></select>
          </label>
          <label>Lehrer
            <select id="filter-teacher"><option value="">Alle Lehrpersonen</option></select>
          </label>
          <label>Prüfungsklasse
            <select id="filter-class"><option value="">Alle Klassen</option></select>
          </label>
          <label>Typ
            <select id="filter-type">
              <option value="">Alle Dateitypen</option>
              <option value="pdf">PDF</option>
              <option value="image">Bild(er)</option>
            </select>
          </label>
          <label>Datum
            <input id="filter-date" type="date">
          </label>
          <label>Sortierung
            <select id="filter-sort">
              <option value="newest">Neueste zuerst</option>
              <option value="oldest">Älteste zuerst</option>
              <option value="subject">Nach Fach</option>
              <option value="popular">Beliebtheit</option>
            </select>
          </label>
          <button class="secondary-button" id="reset-filters" type="button">Filter zurücksetzen</button>
        </div>
        <div id="exam-grid" class="exam-grid" aria-live="polite"></div>
      </section>

      <section id="upload-view" class="view" aria-labelledby="upload-title">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Beitrag für die Gemeinschaft</p>
            <h1 id="upload-title">Prüfung hochladen</h1>
          </div>
        </div>
        <form id="upload-form" novalidate>
          <div class="form-grid">
            <div class="field-group">
              <label for="uploader-name">Name des Uploaders</label>
              <input id="uploader-name" name="uploaderName" type="text" maxlength="80" autocomplete="name" placeholder="Vor- und Nachname">
              <label class="checkbox-row"><input id="anonymous-upload" type="checkbox"> Prüfung anonym hochladen</label>
            </div>
            <label>Aktuelle Klasse
              <select id="uploader-class" name="uploaderClass" required></select>
            </label>
            <label>Klasse der Prüfung
              <select id="exam-class" name="examClass" required></select>
            </label>
            <label>Lehrer
              <input id="exam-teacher" name="teacher" list="teacher-options" maxlength="100" required placeholder="Lehrperson auswählen oder eingeben">
              <datalist id="teacher-options"></datalist>
            </label>
            <label>Fach
              <select id="exam-subject" name="subject" required></select>
            </label>
            <label>Thema / Kapitel / Lektion
              <input id="exam-topic" name="topic" type="text" maxlength="180" required placeholder="z. B. Quadratische Funktionen">
            </label>
          </div>

          <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="Dateien auswählen">
            <div class="upload-icon" aria-hidden="true">↑</div>
            <strong>Dateien hierher ziehen</strong>
            <span>oder</span>
            <button id="file-picker-button" class="primary-button" type="button">Dateien auswählen</button>
            <small id="upload-help"></small>
            <input id="file-input" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" multiple hidden>
          </div>
          <div id="file-preview" class="file-preview"></div>
          <div id="upload-progress" class="upload-progress" hidden>
            <div class="progress-track"><div id="upload-progress-bar" class="progress-bar"></div></div>
            <div class="progress-label"><span id="upload-progress-text">0 %</span><button id="cancel-upload" type="button">Abbrechen</button></div>
          </div>
          <button id="submit-upload" class="primary-button submit-button" type="submit">Prüfung einreichen</button>
        </form>
      </section>

      <section id="favorites-view" class="view" aria-labelledby="favorites-title">
        <div class="page-heading"><div><p class="eyebrow">Gespeichert</p><h1 id="favorites-title">Meine Favoriten</h1></div></div>
        <div id="favorites-grid" class="exam-grid"></div>
      </section>

      <section id="admin-view" class="view" aria-labelledby="admin-title">
        <div class="page-heading"><div><p class="eyebrow">Moderation</p><h1 id="admin-title">Admin-Bereich</h1></div></div>
        <div id="admin-content">
          <div id="admin-stats" class="stats-grid"></div>
          <div class="admin-tabs">
            <button class="admin-tab active" type="button" data-admin-tab="pending">Wartende Prüfungen</button>
            <button class="admin-tab" type="button" data-admin-tab="reports">Meldungen</button>
            <button class="admin-tab" type="button" data-admin-tab="all">Alle Prüfungen</button>
          </div>
          <div id="admin-list" class="admin-list"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="loading-overlay" class="loading-overlay" hidden><div class="spinner"></div></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
